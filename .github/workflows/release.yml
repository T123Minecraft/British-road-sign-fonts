name: Build and Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build resource packs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python scripts/build.py

      - name: Detect version type
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "type=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-pre"* ]]; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Get previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="${GITHUB_REF_NAME}"

          PREVIOUS=$(gh release list \
            --limit 100 \
            --exclude-drafts \
            --json tagName,isDraft \
            --jq '.[] | select(.tagName != "'"$CURRENT"'") | .tagName' \
            | head -n 1)

          echo "Previous release: $PREVIOUS"

          if [ -n "$PREVIOUS" ]; then
            echo "tag=$PREVIOUS" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.previous.outputs.tag }}" ]; then
            gh api \
              --method POST \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f previous_tag_name="${{ steps.previous.outputs.tag }}" \
              > release-notes.json
          else
            gh api \
              --method POST \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              > release-notes.json
          fi

          python - <<'PY'
          import json

          with open("release-notes.json", encoding="utf-8") as f:
              data = json.load(f)

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(data["body"])
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/British Road Sign Fonts v${{ github.ref_name }}.zip
            dist/Motorway Permanent Font v${{ github.ref_name }}.zip
            dist/Motorway Temporary Font v${{ github.ref_name }}.zip
            dist/Pavement Font v${{ github.ref_name }}.zip
            dist/Transport Heavy Font v${{ github.ref_name }}.zip
            dist/Transport Medium Font v${{ github.ref_name }}.zip
            dist/VMS Font v${{ github.ref_name }}.zip
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-pre.') }}

      - name: Upload to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: V86rbgab
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            dist/British Road Sign Fonts v${{ github.ref_name }}.zip

          name: British Road Sign Fonts ${{ github.ref_name }}

          version: ${{ github.ref_name }}

          version-type: ${{ steps.version.outputs.type }}

          dependencies: |
            rItLmRo4 | depends | *

          loaders: |
            minecraft

          game-versions: |
            1.16.5
            1.17.1
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2

      - name: Upload to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: 1648963
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            dist/British Road Sign Fonts v${{ github.ref_name }}.zip

          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: ${{ steps.version.outputs.type }}

          dependencies: |
            required:rItLmRo4

          loaders: |
            minecraft

          game-versions: |
            1.16.5
