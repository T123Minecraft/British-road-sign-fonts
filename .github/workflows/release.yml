name: Build and Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build resource packs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python scripts/build.py

      - name: Detect version type
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "type=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-pre"* ]]; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: British Road Sign Fonts ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/British Road Sign Fonts v${{ github.ref_name }}.zip
            dist/Motorway Permanent Font v${{ github.ref_name }}.zip
            dist/Motorway Temporary Font v${{ github.ref_name }}.zip
            dist/Pavement Font v${{ github.ref_name }}.zip
            dist/Transport Heavy Font v${{ github.ref_name }}.zip
            dist/Transport Medium Font v${{ github.ref_name }}.zip
            dist/VMS Font v${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: V86rbgab
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            dist/British Road Sign Fonts v${{ github.ref_name }}.zip

          name: British Road Sign Fonts ${{ github.ref_name }}

          version: ${{ github.ref_name }}

          version-type: ${{ steps.version.outputs.type }}

          dependencies: |
            rItLmRo4 | depends | *

          loaders: |
            minecraft

          game-versions: |
            1.16.5
            1.17.1
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2