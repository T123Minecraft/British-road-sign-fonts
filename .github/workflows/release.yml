name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build resource packs
        run: |
          python scripts/build.py

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip

      - name: Upload Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: 你的项目ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            dist/*.zip

          name: British Road Sign Fonts ${{ github.ref_name }}
          version: ${{ github.ref_name }}

          loaders: |
            minecraft

          game-versions: |
            1.16.5
            1.17.1
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2
      
